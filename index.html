<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>تحدي المعلومات</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Tahoma,sans-serif}

body{
min-height:100vh;
background:linear-gradient(135deg,#08111f,#123d67,#24145c);
color:white;
}

.container{max-width:1000px;margin:auto;padding:20px}

header{text-align:center;margin-bottom:28px}
header h1{font-size:38px;margin-bottom:8px}
header p{font-size:17px;color:#dbeafe}

.screen{display:none}
.screen.active{display:block}

/* الأقسام */

.categories{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.category{
border:0;
padding:0;
overflow:hidden;
border-radius:22px;
background:white;
cursor:pointer;
box-shadow:0 10px 30px #0006;
transition:.2s;
}

.category:hover{transform:translateY(-6px)}
.category:active{transform:scale(.96)}

.category img{
display:block;
width:100%;
height:170px;
object-fit:cover;
}

.category-title{
padding:17px 7px;
color:#111827;
font-size:18px;
font-weight:bold;
}

/* اللعبة */

.game-top{
display:flex;
justify-content:space-between;
gap:10px;
margin-bottom:15px;
}

.score,.question-number{
padding:11px 17px;
border-radius:12px;
background:#ffffff22;
font-weight:bold;
}

.score{background:#16a34a}

.progress{
height:9px;
background:#ffffff25;
border-radius:20px;
overflow:hidden;
margin-bottom:25px;
}

.progress-bar{
height:100%;
width:0;
background:#22c55e;
transition:.3s;
}

.question-card{
background:white;
color:#111827;
border-radius:25px;
padding:28px 20px;
text-align:center;
}

.timer{
display:inline-block;
background:#fee2e2;
color:#dc2626;
padding:8px 18px;
border-radius:20px;
font-weight:bold;
margin-bottom:18px;
}

.question{
font-size:25px;
font-weight:bold;
line-height:1.5;
margin-bottom:25px;
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.answer{
border:2px solid #e5e7eb;
background:#f9fafb;
padding:17px;
border-radius:15px;
font-size:17px;
cursor:pointer;
transition:.2s;
}

.answer:hover{
background:#eff6ff;
border-color:#3b82f6;
}

.answer.correct{
background:#dcfce7;
border-color:#16a34a;
color:#166534;
}

.answer.wrong{
background:#fee2e2;
border-color:#dc2626;
color:#991b1b;
}

.answer:disabled{cursor:default}

/* النتيجة */

.result-card{
background:white;
color:#111827;
border-radius:25px;
padding:40px 20px;
text-align:center;
}

.result-card h2{font-size:32px}

.final-score{
font-size:55px;
font-weight:bold;
color:#2563eb;
margin:20px;
}

.main-btn{
border:0;
background:#2563eb;
color:white;
padding:14px 28px;
border-radius:14px;
font-size:17px;
cursor:pointer;
margin:6px;
}

.main-btn:hover{background:#1d4ed8}

@media(max-width:700px){
.categories{grid-template-columns:1fr 1fr}
.answers{grid-template-columns:1fr}
header h1{font-size:30px}
.question{font-size:21px}
}

@media(max-width:430px){
.categories{grid-template-columns:1fr}
.category img{height:190px}
}
</style>
</head>

/* =========================
   متغيرات اللعبة
========================= */

let currentCategory="";
let currentQuestions=[];
let currentIndex=0;
let score=0;
let timer=null;
let timeLeft=20;


/* =========================
   بدء اللعبة
========================= */

function startGame(category){

currentCategory=category;

currentQuestions=questions[category].map(x=>({
q:x[0],
a:x[1],
correct:x[2]
}));

/* خلط الأسئلة */
currentQuestions.sort(()=>Math.random()-.5);

currentIndex=0;
score=0;

document.getElementById("home").classList.remove("active");
document.getElementById("result").classList.remove("active");
document.getElementById("game").classList.add("active");

document.getElementById("score").textContent=score;

showQuestion();
}


/* =========================
   عرض السؤال
========================= */

function showQuestion(){

clearInterval(timer);

if(currentIndex>=currentQuestions.length){
showResult();
return;
}

const q=currentQuestions[currentIndex];

document.getElementById("questionNumber").textContent=
"السؤال "+(currentIndex+1)+" من "+currentQuestions.length;

document.getElementById("question").textContent=q.q;

const answers=document.getElementById("answers");

answers.innerHTML="";

q.a.forEach((answer,index)=>{

const button=document.createElement("button");

button.className="answer";
button.textContent=answer;

button.onclick=()=>{
checkAnswer(index,button);
};

answers.appendChild(button);

});

updateProgress();

timeLeft=20;

document.getElementById("timer").textContent=timeLeft;

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer").textContent=timeLeft;

if(timeLeft<=0){

clearInterval(timer);

disableAnswers();

setTimeout(()=>{

currentIndex++;
showQuestion();

},500);

}

},1000);

}


/* =========================
   الإجابة
========================= */

function checkAnswer(index,button){

clearInterval(timer);

disableAnswers();

const q=currentQuestions[currentIndex];

const all=document.querySelectorAll(".answer");

if(index===q.correct){

button.classList.add("correct");

score+=10;

document.getElementById("score").textContent=score;

}else{

button.classList.add("wrong");

all[q.correct].classList.add("correct");

}

setTimeout(()=>{

currentIndex++;
showQuestion();

},900);

}


/* =========================
   تعطيل الاختيارات
========================= */

function disableAnswers(){

document.querySelectorAll(".answer").forEach(button=>{
button.disabled=true;
});

}


/* =========================
   شريط التقدم
========================= */

function updateProgress(){

const percentage=
(currentIndex/currentQuestions.length)*100;

document.getElementById("progressBar").style.width=
percentage+"%";

}


/* =========================
   النتيجة
========================= */

function showResult(){

clearInterval(timer);

document.getElementById("game").classList.remove("active");
document.getElementById("result").classList.add("active");

document.getElementById("finalScore").textContent=score;

const total=currentQuestions.length*10;

let text="";

if(score===total){
text="🏆 أسطوري! جبت الدرجة النهائية!";
}
else if(score>=70){
text="🔥 ممتاز جدًا!";
}
else if(score>=50){
text="👏 كويس! تقدر تكسر رقمك.";
}
else{
text="💪 جرّب تاني وهتجيب أعلى!";
}

document.getElementById("resultText").textContent=text;

}


/* =========================
   إعادة اللعب
========================= */

function restartGame(){
startGame(currentCategory);
}


/* =========================
   الرجوع للأقسام
========================= */

function goHome(){

clearInterval(timer);

document.getElementById("game").classList.remove("active");
document.getElementById("result").classList.remove("active");
document.getElementById("home").classList.add("active");

}

</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<title>تحدي المعلومات</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Tahoma, sans-serif;
}

body {
    background: linear-gradient(135deg, #101827, #172554);
    color: white;
    min-height: 100vh;
}

.container {
    width: 92%;
    max-width: 900px;
    margin: auto;
    padding: 25px 0;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

header h1 {
    font-size: 34px;
    margin-bottom: 8px;
}

header p {
    color: #cbd5e1;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

/* الأقسام */

.categories {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.category {
    border: none;
    border-radius: 18px;
    padding: 22px 15px;
    color: white;
    font-size: 20px;
    cursor: pointer;
    background: #1e293b;
    transition: 0.2s;
    box-shadow: 0 8px 20px rgba(0,0,0,.2);
}

.category:hover {
    transform: translateY(-4px);
    background: #26364d;
}

.category span {
    display: block;
    font-size: 35px;
    margin-bottom: 8px;
}

/* اللعبة */

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1e293b;
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 18px;
}

.score {
    color: #facc15;
    font-weight: bold;
}

.timer {
    color: #38bdf8;
    font-weight: bold;
}

.progress {
    background: #334155;
    height: 9px;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 20px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #22c55e;
    transition: .3s;
}

.question-box {
    background: #1e293b;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.question-number {
    color: #94a3b8;
    margin-bottom: 12px;
}

.question {
    font-size: 25px;
    line-height: 1.6;
    margin-bottom: 22px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    border: 2px solid #334155;
    background: #0f172a;
    color: white;
    padding: 16px;
    border-radius: 14px;
    font-size: 18px;
    cursor: pointer;
    text-align: right;
    transition: .2s;
}

.answer:hover {
    border-color: #38bdf8;
    transform: translateX(-3px);
}

.answer.correct {
    background: #166534;
    border-color: #22c55e;
}

.answer.wrong {
    background: #991b1b;
    border-color: #ef4444;
}

.answer.disabled {
    pointer-events: none;
}

.next-btn,
.start-btn,
.back-btn,
.restart-btn {
    border: none;
    padding: 14px 25px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    color: white;
    margin-top: 18px;
}

.next-btn {
    background: #2563eb;
    display: none;
}

.start-btn,
.restart-btn {
    background: #16a34a;
}

.back-btn {
    background: #475569;
}

/* النتيجة */

.result-box {
    background: #1e293b;
    padding: 35px;
    text-align: center;
    border-radius: 22px;
}

.result-box h2 {
    font-size: 30px;
    margin-bottom: 20px;
}

.final-score {
    font-size: 45px;
    color: #facc15;
    margin: 20px;
}

@media(max-width:600px) {
    .categories {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 28px;
    }

    .question {
        font-size: 21px;
    }
}
</style>
</head>

</div>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي المعلومات</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Tahoma, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #111827, #1e3a8a, #312e81);
    color: white;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

header h1 {
    font-size: 35px;
    margin-bottom: 8px;
}

header p {
    color: #dbeafe;
    font-size: 17px;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

/* الأقسام */

.categories {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.category {
    border: none;
    border-radius: 22px;
    padding: 25px 12px;
    min-height: 150px;
    color: white;
    cursor: pointer;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    transition: 0.2s;
    backdrop-filter: blur(8px);
}

.category:hover {
    transform: translateY(-5px);
    background: rgba(255,255,255,0.2);
}

.category:active {
    transform: scale(0.96);
}

.icon {
    width: 60px;
    height: 60px;
    margin: auto auto 12px;
    display: block;
    fill: none;
    stroke: white;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.category-title {
    font-size: 18px;
    font-weight: bold;
}

/* شاشة الأسئلة */

.game-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.score {
    background: #16a34a;
    padding: 10px 17px;
    border-radius: 12px;
    font-weight: bold;
}

.question-number {
    background: rgba(255,255,255,0.15);
    padding: 10px 17px;
    border-radius: 12px;
}

.progress {
    width: 100%;
    height: 9px;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #22c55e;
    transition: width 0.3s;
}

.question-card {
    background: white;
    color: #111827;
    border-radius: 25px;
    padding: 30px 20px;
    text-align: center;
}

.question {
    font-size: 25px;
    font-weight: bold;
    line-height: 1.5;
    margin-bottom: 25px;
}

.timer {
    display: inline-block;
    background: #fee2e2;
    color: #dc2626;
    padding: 8px 18px;
    border-radius: 20px;
    font-weight: bold;
    margin-bottom: 20px;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.answer {
    border: 2px solid #e5e7eb;
    background: #f9fafb;
    padding: 17px;
    border-radius: 15px;
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #eff6ff;
    border-color: #3b82f6;
}

.answer.correct {
    background: #dcfce7;
    border-color: #16a34a;
    color: #166534;
}

.answer.wrong {
    background: #fee2e2;
    border-color: #dc2626;
    color: #991b1b;
}

.answer:disabled {
    cursor: default;
}

    border-radius: 25
